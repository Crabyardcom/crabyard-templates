name: Signed desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            config: ''
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            config: --config src-tauri/signing.windows.conf.json
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            config: ''
          - os: macos-latest
            platform: macos
            target: x86_64-apple-darwin
            config: ''
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VITE_UPDATER_ENABLED: 'true'
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release and signing prerequisites
        run: node scripts/release.mjs
      - uses: oven-sh/setup-bun@v2
        if: "'{{PACKAGE_MANAGER}}' == 'bun'"
      - run: corepack enable
        if: "'{{PACKAGE_MANAGER}}' == 'pnpm' || '{{PACKAGE_MANAGER}}' == 'yarn'"
      - run: node scripts/install.mjs
      - run: {{PM_RUN}} check
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'signing.p12'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $certificate) { throw 'The certificate has no private key' }
          @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 4 | Set-Content src-tauri/signing.windows.conf.json
          Remove-Item -LiteralPath $certificatePath
      - name: Build signed installers and update manifest
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: {{PM_RUN}} tauri
          args: --target ${{ matrix.target }} --ci ${{ matrix.config }}
          tagName: ${{ inputs.tag }}
          releaseName: '{{APP_NAME}} ${{ inputs.tag }}'
          releaseDraft: true
          generateReleaseNotes: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
